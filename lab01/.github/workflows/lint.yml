name: Validate lab files
on:
  push:
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install YAML dependency
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Check shell script syntax
        run: for file in check.sh scripts/*.sh tests/*.sh; do bash -n "$file" || exit 1; done
      - name: Check safe OS preflight
        run: bash tests/test-preflight.sh
      - name: Check topology and startup configurations
        run: python3 scripts/static_lint.py
